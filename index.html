<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Ludo Pro</title>
<style>
:root{--bg:#07111f;--card:#101f34;--line:#29405e;--gold:#ffc928}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101c,#122746);color:#fff;font-family:system-ui,Arial}
.app{max-width:520px;margin:auto;min-height:100vh;padding:14px}.top{display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:27px}.muted{opacity:.65;font-size:12px}.coins{background:#162a44;border:1px solid #345070;padding:9px 12px;border-radius:14px}
.card{background:#0e1d31;border:1px solid var(--line);border-radius:20px;padding:13px;margin-top:12px;box-shadow:0 15px 40px #0005}
.profile{display:flex;gap:10px;align-items:center}.avatar{width:45px;height:45px;border-radius:50%;display:grid;place-items:center;background:#334f78;font-size:24px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.tabs button{background:#182c46;color:#fff}
button{border:0;border-radius:13px;padding:11px;font-weight:800;font-size:14px}.active{outline:2px solid var(--gold)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:9px}.menu button{padding:16px;background:#193454;color:#fff}.gold{background:#ffc928!important;color:#111!important}.green{background:#27a844!important}.purple{background:#7040bd!important}
#game{display:none}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.p{padding:7px 2px;border-radius:10px;text-align:center;font-size:11px;opacity:.45}.p.on{opacity:1;outline:2px solid white}
#board{width:100%;aspect-ratio:1;background:#eee;border:4px solid #07101a;border-radius:12px;display:block;margin-top:9px}
.status{text-align:center;min-height:25px;margin:9px 0;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#roll{background:var(--gold);color:#111}.back{background:#263c58;color:#fff}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #263a53}.hidden{display:none}
.small{font-size:12px}.badge{background:#263c58;padding:4px 8px;border-radius:9px}
</style>
<script src="/socket.io/socket.io.js"></script></head>
<body><main class="app">
<section id="home">
<div class="top"><div><h1>🎲 My Ludo Pro</h1><div class="muted">Play • Win • Have Fun</div></div><div class="coins">🪙 <b id="coins">1250</b></div></div>
<div class="card profile"><div class="avatar">😎</div><div><b id="username">Player123</b><div class="muted">Level 8 • ⭐ 124</div></div></div>
<div class="tabs"><button onclick="showPanel('online')" class="active">🌐 Online</button><button onclick="showPanel('local')">👥 Local</button><button onclick="showPanel('computer')">🤖 AI</button></div>
<div id="online" class="card"><div class="menu">
<button class="gold" onclick="quickMatch()">🎮 Quick Match</button>
<button class="purple" onclick="createRoom()">🔐 Private Room</button>
<button onclick="joinRoom()">🔑 Join Room</button>
<button onclick="alert('Tournament lobby demo — backend जोड़ने पर live tournaments चलेंगे.')">🏆 Tournament</button>
<button onclick="alert('Friends system demo — backend जोड़ने पर invite/friends sync होगा.')">👫 Friends</button>
</div></div>
<div id="local" class="card hidden"><div class="menu"><button class="green" onclick="startGame('Local Multiplayer')">👥 2–4 Players</button><button onclick="startGame('Pass & Play')">📱 Pass & Play</button></div></div>
<div id="computer" class="card hidden"><div class="menu"><button onclick="startGame('Easy AI')">🤖 Easy</button><button onclick="startGame('Hard AI')">🧠 Hard</button></div></div>
<div class="card"><div class="row"><span>🎁 Daily Reward</span><button class="badge" onclick="reward()">Claim</button></div><div class="row"><span>🎡 Spin & Win</span><button class="badge" onclick="spin()">Spin</button></div><div class="row"><span>🥇 Leaderboard</span><span class="badge">#42</span></div><div class="row"><span>🛒 Store</span><span class="badge">Coming soon</span></div></div>
</section>

<section id="game">
<div class="top"><div><h1>🎲 <span id="mode">Ludo</span></h1><div class="muted">Private room: <span id="room">—</span></div></div><div class="coins">🪙 <span id="gameCoins">1250</span></div></div>
<div class="card"><div class="players" id="players"></div><canvas id="board"></canvas><div class="status" id="status"></div>
<div class="actions"><button id="roll">🎲 Roll</button><button class="back" onclick="goHome()">← Lobby</button></div></div>
</section>
</main>
<script>
const C=['red','green','yellow','blue'], names=['Red','Green','Yellow','Blue'], cols={red:'#e53935',green:'#25a244',yellow:'#f2b705',blue:'#1976d2'};
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d');let W,cell,current=0,dice=0,over=false;
let pieces=C.map(()=>[-1,-1,-1,-1]);const starts=[0,13,26,39],safe=new Set([0,8,13,21,26,34,39,47]);
function resize(){W=canvas.clientWidth;canvas.width=W*devicePixelRatio;canvas.height=W*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cell=W/15;draw()}
window.addEventListener('resize',resize);
const coords=[[6,0],[7,0],[8,0],[8,1],[8,2],[9,2],[10,2],[11,2],[12,2],[12,3],[12,4],[13,4],[14,4],[14,5],[14,6],[13,6],[12,6],[12,7],[12,8],[13,8],[14,8],[14,9],[14,10],[13,10],[12,10],[12,11],[12,12],[11,12],[10,12],[9,12],[8,12],[8,13],[8,14],[7,14],[6,14],[6,13],[6,12],[5,12],[4,12],[3,12],[2,12],[2,11],[2,10],[1,10],[0,10],[0,9],[0,8],[1,8],[2,8],[2,7],[2,6],[1,6],[0,6],[0,5],[0,4],[1,4],[2,4],[2,3],[2,2],[3,2],[4,2],[5,2],[6,2],[6,1]];
function xy(p){return coords[p%52]}function cellfill(x,y,c){ctx.fillStyle=c;ctx.fillRect(x*cell,y*cell,cell,cell);ctx.strokeStyle='#aaa';ctx.strokeRect(x*cell,y*cell,cell,cell)}
function draw(){ctx.clearRect(0,0,W,W);ctx.fillStyle='#f5f1e8';ctx.fillRect(0,0,W,W);[['red',0,0],['green',9,0],['yellow',9,9],['blue',0,9]].forEach(([c,x,y])=>{ctx.fillStyle=cols[c];ctx.fillRect(x*cell,y*cell,6*cell,6*cell);ctx.fillStyle='#fff';ctx.fillRect((x+1)*cell,(y+1)*cell,4*cell,4*cell)});
for(let i=0;i<52;i++){let [x,y]=xy(i);cellfill(x,y,safe.has(i)?'#ddd':'#fff')}
const lanes={red:[[6,1],[6,2],[6,3],[6,4],[6,5]],green:[[8,6],[9,6],[10,6],[11,6],[12,6]],yellow:[[8,8],[8,9],[8,10],[8,11],[8,12]],blue:[[6,8],[5,8],[4,8],[3,8],[2,8]]};for(let c of C)lanes[c].forEach(([x,y])=>cellfill(x,y,cols[c]));
ctx.fillStyle='#fff';ctx.fillRect(6*cell,6*cell,3*cell,3*cell);ctx.fillStyle=cols.red;ctx.beginPath();ctx.moveTo(6*cell,6*cell);ctx.lineTo(9*cell,6*cell);ctx.lineTo(7.5*cell,7.5*cell);ctx.fill();ctx.fillStyle=cols.green;ctx.beginPath();ctx.moveTo(9*cell,6*cell);ctx.lineTo(9*cell,9*cell);ctx.lineTo(7.5*cell,7.5*cell);ctx.fill();ctx.fillStyle=cols.yellow;ctx.beginPath();ctx.moveTo(9*cell,9*cell);ctx.lineTo(6*cell,9*cell);ctx.lineTo(7.5*cell,7.5*cell);ctx.fill();ctx.fillStyle=cols.blue;ctx.beginPath();ctx.moveTo(6*cell,9*cell);ctx.lineTo(6*cell,6*cell);ctx.lineTo(7.5*cell,7.5*cell);ctx.fill();
const yards={red:[[1.5,1.5],[4,1.5],[1.5,4],[4,4]],green:[[10.5,1.5],[13,1.5],[10.5,4],[13,4]],yellow:[[10.5,10.5],[13,10.5],[10.5,13],[13,13]],blue:[[1.5,10.5],[4,10.5],[1.5,13],[4,13]]};
C.forEach((c,ci)=>pieces[ci].forEach((p,j)=>{let q;if(p==-1)q=yards[c][j];else if(p==57)q=null;else if(p<=51){let a=xy((starts[ci]+p)%52);q=[a[0]+.5,a[1]+.5]}else q=lanes[c][p-52].map(v=>v+.5);if(q){ctx.beginPath();ctx.arc(q[0]*cell,q[1]*cell,cell*.32,0,7);ctx.fillStyle=cols[c];ctx.fill();ctx.lineWidth=(ci==current&&dice&&movable(ci,j))?4:2;ctx.strokeStyle='#fff';ctx.stroke();ctx.fillStyle='#fff';ctx.font=`bold ${cell*.26}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(j+1,q[0]*cell,q[1]*cell)}}))}
function movable(ci,j){let p=pieces[ci][j];return p!==57&&(p===-1?dice===6:p+dice<=57)}
function roll(){if(over||dice)return;dice=1+Math.floor(Math.random()*6);document.getElementById('status').textContent=`${names[current]}: गोटी चुनें (${dice})`;let any=pieces[current].some((_,j)=>movable(current,j));if(!any)setTimeout(()=>next(dice===6),700);draw()}
function move(ci,j){if(!dice||ci!==current||!movable(ci,j))return;let p=pieces[ci][j];p=p===-1?0:p+dice;let cap=false;if(p<52){let a=(starts[ci]+p)%52;C.forEach((c,oi)=>{if(oi!==ci)pieces[oi].forEach((op,k)=>{if(op>=0&&op<52&&(starts[oi]+op)%52===a&&!safe.has(a)){pieces[oi][k]=-1;cap=true}})})}pieces[ci][j]=p;let win=pieces[ci].every(x=>x===57);dice=0;draw();if(win){over=true;document.getElementById('status').textContent=`🏆 ${names[ci]} जीत गया!`;return}next(p===57||cap)}
function next(extra){if(!extra)current=(current+1)%4;dice=0;document.getElementById('status').textContent=`${names[current]} की बारी — Roll करें`;document.querySelectorAll('.p').forEach((e,i)=>e.classList.toggle('on',i===current));draw()}
canvas.addEventListener('click',e=>{let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/cell,y=(e.clientY-r.top)/cell;pieces[current].forEach((p,j)=>{let q;if(p==-1){const ys={red:[[1.5,1.5],[4,1.5],[1.5,4],[4,4]],green:[[10.5,1.5],[13,1.5],[10.5,4],[13,4]],yellow:[[10.5,10.5],[13,10.5],[10.5,13],[13,13]],blue:[[1.5,10.5],[4,10.5],[1.5,13],[4,13]]};q=ys[C[current]][j]}else if(p<52){let a=xy((starts[current]+p)%52);q=[a[0]+.5,a[1]+.5]}else if(p<57)q={red:[6.5,1.5],green:[8.5,6.5],yellow:[8.5,8.5],blue:[6.5,8.5]}[C[current]];if(q&&Math.hypot(q[0]-x,q[1]-y)<.7)move(current,j)})});
function startGame(mode){document.getElementById('home').style.display='none';document.getElementById('game').style.display='block';document.getElementById('mode').textContent=mode;document.getElementById('room').textContent=mode.includes('Private')?Math.random().toString(36).slice(2,8).toUpperCase():'—';pieces=C.map(()=>[-1,-1,-1,-1]);current=0;dice=0;over=false;document.getElementById('players').innerHTML=C.map((c,i)=>`<div class="p ${c} ${i===0?'on':''}">${names[i]}<br>🏠 4</div>`).join('');document.getElementById('status').textContent='Red की बारी — Roll करें';setTimeout(resize,30)}
function goHome(){document.getElementById('game').style.display='none';document.getElementById('home').style.display='block'}
function showPanel(id){['online','local','computer'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
function privateRoom(){let code=Math.random().toString(36).slice(2,8).toUpperCase();alert('Private Room Code: '+code+'\\nइसे दोस्तों के साथ share करें.')}
function reward(){let c=+document.getElementById('coins').textContent+100;document.getElementById('coins').textContent=c;document.getElementById('gameCoins').textContent=c;alert('🎁 100 coins मिले!')}
function spin(){let n=[20,50,100,200][Math.floor(Math.random()*4)];let c=+document.getElementById('coins').textContent+n;document.getElementById('coins').textContent=c;document.getElementById('gameCoins').textContent=c;alert('🎡 आपने '+n+' coins जीते!')}
document.getElementById('roll').onclick=roll;

// ===== ONLINE BACKEND =====
let socket=null, onlineRoom=null, onlinePlayerId=null;
try {
  socket=io();
  socket.on('connect',()=>{ onlinePlayerId=socket.id; });
  socket.on('room:created', data=>{
    onlineRoom=data.roomCode; document.getElementById('room').textContent=data.roomCode;
    startOnlineGame(data);
    alert('Private Room Code: '+data.roomCode+'\nइसे दोस्त के साथ share करें.');
  });
  socket.on('room:joined', data=>{
    onlineRoom=data.roomCode; document.getElementById('room').textContent=data.roomCode;
    startOnlineGame(data);
  });
  socket.on('room:error', msg=>alert(msg));
  socket.on('game:state', state=>{
    pieces=state.pieces; current=state.current; dice=state.dice||0; over=state.over;
    if(document.getElementById('game').style.display!=='none'){
      document.getElementById('status').textContent=state.status||(`${names[current]} की बारी`);
      draw();
    }
  });
  socket.on('game:dice', data=>{
    dice=data.dice; document.getElementById('status').textContent=data.status; draw();
  });
  socket.on('game:over', data=>{
    over=true; document.getElementById('status').textContent='🏆 '+data.winner+' जीत गया!';
  });
} catch(e) {}

function startOnlineGame(data){
  document.getElementById('home').style.display='none';
  document.getElementById('game').style.display='block';
  document.getElementById('mode').textContent='Online Multiplayer';
  pieces=data.pieces||C.map(()=>[-1,-1,-1,-1]); current=data.current||0; dice=data.dice||0; over=false;
  document.getElementById('players').innerHTML=C.map((c,i)=>`<div class="p ${c} ${i===current?'on':''}">${names[i]}<br>Online</div>`).join('');
  document.getElementById('status').textContent=data.status||'Game started';
  setTimeout(resize,30);
}
function quickMatch(){
  if(!socket||!socket.connected){alert('Backend server से connection नहीं है.');return;}
  socket.emit('match:quick');
}
function createRoom(){
  if(!socket||!socket.connected){alert('Backend server से connection नहीं है.');return;}
  socket.emit('room:create');
}
function joinRoom(){
  const code=prompt('Private Room Code डालें:');
  if(code && socket && socket.connected) socket.emit('room:join', code.trim().toUpperCase());
}
// Override local roll/move for online room
const oldRoll=roll;
roll=function(){
  if(onlineRoom){ if(socket) socket.emit('game:roll', {roomCode:onlineRoom}); }
  else oldRoll();
};
const oldMove=move;
move=function(ci,j){
  if(onlineRoom){ if(socket) socket.emit('game:move', {roomCode:onlineRoom, color:ci, piece:j}); }
  else oldMove(ci,j);
};

</script></body></html>
